[package]
name = "netodia-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The SQLite library, the scanner and everything that reads or writes a track's tags"
publish = false

[lib]
doctest = false

[dependencies]
netodia-core = { path = "../netodia-core" }
# The scanner and the metadata reader both cache covers through the store.
netodia-artwork = { path = "../netodia-artwork" }
# `ingest::metadata`'s duration probe, for the containers lofty can't measure. The one edge
# this crate has into the audio stack, and it points at its bottom tier.
netodia-audio = { path = "../netodia-audio" }

sqlx.workspace = true
tokio.workspace = true
lofty.workspace = true
walkdir.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
rayon.workspace = true
blake3.workspace = true
image.workspace = true
jiff.workspace = true
log.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
dunce.workspace = true

[dev-dependencies]
netodia-testkit = { path = "../netodia-testkit" }
# The scan and watcher suites build a library under a throwaway root.
tempfile.workspace = true

[lints]
workspace = true
