name: Memory profile

on:
  pull_request:
    branches: [main]
    paths:
      - crates/netodia-artwork/**
      - crates/netodia-store/**
      - crates/netodia-ui/**
      - crates/netodia-views/**
      - vendor/i-slint-renderer-femtovg/**
      - Cargo.toml
      - Cargo.lock
      - scripts/profile-ui-memory.py
      - scripts/test_profile_ui_memory.py
      - .github/workflows/memory-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Whole UI memory (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, optimized]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
      BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      SLINT_BACKEND: winit-femtovg
      WINIT_UNIX_BACKEND: x11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the same probe for both revisions; baseline does not contain it.
      - name: Save measurement script
        run: cp scripts/profile-ui-memory.py "$RUNNER_TEMP/profile-ui-memory.py"
      - name: Check out baseline
        if: matrix.revision == 'baseline'
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git checkout --detach FETCH_HEAD
      - name: Record revision
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/linux-system-deps
        with:
          extra-packages: xvfb xauth xdotool imagemagick libgl1-mesa-dri mesa-utils
      - uses: ./.github/actions/headless-audio
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ui-memory-release
      - name: Enable the same diagnostic navigation on both revisions
        run: python "$RUNNER_TEMP/profile-ui-memory.py" --prepare-source crates/netodia/src/main.rs
      - name: Build complete release application
        run: cargo build --release --locked -p netodia
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Netodia-Linux-profile-${{ matrix.revision }}
          path: target/release/Netodia
          if-no-files-found: error
          retention-days: 7
      - name: Measure visible UI in English and Chinese
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            python "$RUNNER_TEMP/profile-ui-memory.py" \
              --binary target/release/Netodia --output "$RUNNER_TEMP/ui-memory"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-memory-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/ui-memory/summary.md
            ${{ runner.temp }}/ui-memory/results.json
            ${{ runner.temp }}/ui-memory/bootstrap.log
            ${{ runner.temp }}/ui-memory/**/samples.csv
            ${{ runner.temp }}/ui-memory/**/mounted-count.txt
            ${{ runner.temp }}/ui-memory/**/window-geometry.txt
            ${{ runner.temp }}/ui-memory/**/app.log
            ${{ runner.temp }}/ui-memory/**/window.png
          if-no-files-found: warn
          retention-days: 30

  windows-build:
    name: Windows release binary
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ui-memory-release
      - name: Build complete release application
        run: cargo build --release --locked -p netodia
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Netodia-Windows-memory-optimized
          path: target/release/Netodia.exe
          if-no-files-found: error
          retention-days: 30

  artwork:
    name: Compare full and scaled artwork decode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-system-deps
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: artwork-memory
      - name: Build release memory probe
        run: cargo build --release --locked -p netodia-artwork --example artwork_footprint
      - name: Measure both paths in separate processes
        shell: bash
        run: |
          set -euo pipefail
          probe=target/release/examples/artwork_footprint
          "$probe" fixture "$RUNNER_TEMP/cover.jpg"
          mkdir -p memory-profile
          for mode in full scaled; do
            /usr/bin/time -f '%M' -o "memory-profile/$mode.rss" \
              "$probe" "$mode" "$RUNNER_TEMP/cover.jpg" > "memory-profile/$mode.txt"
          done
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('memory-profile')
          full = int((root / 'full.rss').read_text())
          scaled = int((root / 'scaled.rss').read_text())
          report = (
              '## Artwork decode peak RSS\n\n'
              '| Path | Peak RSS (KiB) |\n| --- | ---: |\n'
              f'| Full decode before resize | {full} |\n'
              f'| Scaled decode before resize | {scaled} |\n\n'
              f'Peak reduction: {(full - scaled) / full:.1%}.\n\n'
              'Same synthetic 4096x4096 JPEG, same 72x72 output, separate release processes. '
              'This measures the artwork path, not whole-application idle memory.\n\n'
              '```text\n'
              + (root / 'full.txt').read_text()
              + (root / 'scaled.txt').read_text()
              + '```\n'
          )
          (root / 'summary.md').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artwork-memory-profile
          path: memory-profile/
          retention-days: 30
