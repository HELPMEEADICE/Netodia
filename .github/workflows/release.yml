name: Build and release

on:
  # Build after a release is published. Draft releases are built when published.
  release:
    types: [published]
  # Manual runs create downloadable Actions artifacts and never touch a Release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netodia-build-${{ github.event.release.tag_name || format('manual-{0}', github.run_number) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-signing:
    name: Release signing preflight
    runs-on: ubuntu-latest
    steps:
      - name: Skip signing for non-release events
        if: github.event_name != 'release'
        run: echo "Release signing is only required for published releases."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'release'

      - name: Require release signing secrets
        if: github.event_name == 'release'
        shell: bash
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PW: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          missing=0
          for name in KEY PW; do
            if [[ -z "${!name}" ]]; then
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Configure MINISIGN_SECRET_KEY (base64-encoded key file) and MINISIGN_PASSWORD in repository Actions secrets before publishing a release."
            exit 1
          fi

      - uses: ./.github/actions/install-minisign
        if: github.event_name == 'release'

      - name: Prepare signing test version
        if: github.event_name == 'release'
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/prepare-release.py

      - name: Create signing test payload
        if: github.event_name == 'release'
        shell: bash
        run: printf 'Netodia release signing preflight\n' > "$RUNNER_TEMP/netodia-signing-check"

      - uses: ./.github/actions/minisign-sign
        if: github.event_name == 'release'
        with:
          key: ${{ secrets.MINISIGN_SECRET_KEY }}
          password: ${{ secrets.MINISIGN_PASSWORD }}
          files: ${{ runner.temp }}/netodia-signing-check
          trusted-comment: version=${{ steps.metadata.outputs.version }} preflight=true

      - uses: ./.github/actions/minisign-verify
        if: github.event_name == 'release'
        with:
          signatures: ${{ runner.temp }}/netodia-signing-check.minisig

      - name: Clean signing test payload
        if: always() && github.event_name == 'release'
        shell: bash
        run: rm -f "$RUNNER_TEMP/netodia-signing-check" "$RUNNER_TEMP/netodia-signing-check.minisig"

  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [release-signing]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,       os: linux,   arch: x86_64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,    os: linux,   arch: aarch64 }
          - { target: x86_64-pc-windows-msvc,    runner: windows-2025-vs2026, os: windows, arch: x86_64 }
          - { target: aarch64-pc-windows-msvc,   runner: windows-11-arm,      os: windows, arch: aarch64 }
    env:
      TAG: ${{ github.event.release.tag_name || format('manual-{0}', github.run_number) }}
      ARCH: ${{ matrix.arch }}
      BINARY: target/${{ matrix.target }}/release/Netodia
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
      NETODIA_RADIO_BLOCKLIST: ${{ secrets.RADIO_BLOCKLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/prepare-release.py

      - uses: ./.github/actions/linux-system-deps
        if: runner.os == 'Linux'
        with:
          extra-packages: rpm

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-release-${{ matrix.os }}-${{ matrix.arch }}
          target: ${{ matrix.target }}

      # Only workspace versions changed; keep third-party dependencies locked.
      - name: Synchronize release workspace lockfile
        if: github.event_name == 'release'
        run: cargo update --workspace

      - name: Build Netodia
        run: cargo build --release -p netodia --target ${{ matrix.target }} --locked

      - name: Package Linux tarball
        if: matrix.os == 'linux'
        shell: bash
        run: bash scripts/build-tarball.sh "netodia-${TAG}-${ARCH}-linux.tar.gz"

      - name: Package AppImage
        if: matrix.os == 'linux'
        shell: bash
        run: bash scripts/build-appimage.sh "netodia-${TAG}-${ARCH}.AppImage"

      - name: Package RPM
        if: matrix.os == 'linux'
        shell: bash
        run: |
          bash scripts/build-rpm.sh
          cp ~/rpmbuild/RPMS/${ARCH}/netodia-*.rpm .

      - name: Install cargo-deb
        if: matrix.os == 'linux'
        run: cargo install --locked --version 3.7.0 cargo-deb

      - name: Package deb
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cargo deb -p netodia --target ${{ matrix.target }} --no-build
          src="$(ls target/${{ matrix.target }}/debian/*.deb)"
          cp "$src" "netodia-${TAG}-${ARCH}.deb"

      - uses: ./.github/actions/setup-wix
        if: matrix.os == 'windows'

      - name: Package MSI
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cargo wix --toolset modern --package netodia --target ${{ matrix.target }} --no-build --nocapture
          $packages = Get-ChildItem -Path "target/wix/" -Filter "*.msi" -Recurse
          if (-not $packages) { throw "cargo wix did not produce an MSI" }
          $packages | ForEach-Object {
            Copy-Item $_.FullName -Destination "netodia-$env:TAG-$env:ARCH.msi"
          }

      - name: Package portable ZIP
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "netodia-portable"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $bundle "licenses") -Force | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/Netodia.exe" -Destination $bundle
          Copy-Item -LiteralPath "LICENSE" -Destination $bundle
          Copy-Item -Path "licenses/*" -Destination (Join-Path $bundle "licenses") -Recurse
          @"
          Netodia portable package

          Extract this archive anywhere and run Netodia.exe. No installation is required.
          "@ | Set-Content -LiteralPath (Join-Path $bundle "README.txt") -Encoding utf8
          Compress-Archive -Path (Join-Path $bundle "*") `
            -DestinationPath "netodia-$env:TAG-$env:ARCH-windows.zip" -CompressionLevel Optimal -Force

      - name: Generate build provenance attestation
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            netodia-*.tar.gz
            netodia-*.AppImage
            netodia-*.rpm
            netodia-*.deb
            netodia-*.msi
            netodia-*.zip

      - uses: ./.github/actions/install-minisign
        if: github.event_name == 'release'

      - uses: ./.github/actions/minisign-sign
        if: github.event_name == 'release'
        with:
          key: ${{ secrets.MINISIGN_SECRET_KEY }}
          password: ${{ secrets.MINISIGN_PASSWORD }}
          files: netodia-*.tar.gz netodia-*.AppImage netodia-*.rpm netodia-*.deb netodia-*.msi netodia-*.zip
          trusted-comment: version=${{ steps.metadata.outputs.version }} target=${{ matrix.target }} file={file}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            netodia-*.tar.gz
            netodia-*.AppImage
            netodia-*.rpm
            netodia-*.deb
            netodia-*.msi
            netodia-*.zip
            netodia-*.minisig
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: ./.github/actions/install-minisign

      - uses: ./.github/actions/minisign-verify
        with:
          signatures: artifacts/*.minisig

      - name: Prepare manifest version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/prepare-release.py

      - name: Capture release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --json body -q '.body' > release-notes.md || : > release-notes.md

      - uses: ./.github/actions/build-manifest
        with:
          version: ${{ steps.metadata.outputs.version }}
          tag: ${{ env.TAG }}
          artifacts: artifacts/
          notes-file: release-notes.md
          out: latest.json

      - uses: ./.github/actions/minisign-sign
        with:
          key: ${{ secrets.MINISIGN_SECRET_KEY }}
          password: ${{ secrets.MINISIGN_PASSWORD }}
          files: latest.json
          trusted-comment: version=${{ steps.metadata.outputs.version }} manifest=true

      - uses: ./.github/actions/minisign-verify
        with:
          signatures: latest.json.minisig

      - uses: ./.github/actions/sha256sums
        with:
          directory: artifacts

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$TAG" artifacts/* latest.json latest.json.minisig --clobber
